name: Regenerate homepage logo

on:
  push:
    branches:
      - issue-10-update-logo-contact
    paths:
      - .github/workflows/regenerate-homepage-logo.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Install Pillow
        run: python3 -m pip install --user Pillow

      - name: Regenerate homepage WebP
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("images/logo.png")
          output = Path("images/logo-home.webp")
          target_width = 960

          with Image.open(source) as image:
              image = image.convert("RGB")
              target_height = round(image.height * target_width / image.width)
              resized = image.resize((target_width, target_height), Image.Resampling.LANCZOS)
              resized.save(output, format="WEBP", quality=90, method=6)
              print(f"source={image.width}x{image.height}")
              print(f"homepage={resized.width}x{resized.height}")
              print(f"homepage_bytes={output.stat().st_size}")
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/regenerate-homepage-logo.yml

      - name: Commit regenerated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Regenerate homepage logo"
          git push
