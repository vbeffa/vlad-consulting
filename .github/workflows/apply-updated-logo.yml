name: Apply updated logo

on:
  push:
    branches:
      - issue-10-update-logo-contact
    paths:
      - .image-transfer/ready

permissions:
  contents: write

jobs:
  update-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Pillow
        run: python3 -m pip install --user Pillow

      - name: Reconstruct accepted image
        run: |
          cat .image-transfer/part*.txt | base64 --decode > /tmp/logo-source.webp

      - name: Generate site images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          source = Path("/tmp/logo-source.webp")
          full = Path("images/logo.png")
          home = Path("images/logo-home.webp")

          with Image.open(source) as image:
              image = image.convert("RGB")
              image.save(full, format="PNG", optimize=True)

              target_width = 960
              target_height = round(image.height * target_width / image.width)
              resized = image.resize((target_width, target_height), Image.Resampling.LANCZOS)
              resized.save(home, format="WEBP", quality=90, method=6)

              print(f"full={image.width}x{image.height} bytes={full.stat().st_size}")
              print(f"home={resized.width}x{resized.height} bytes={home.stat().st_size}")
          PY

      - name: Remove transfer scaffolding
        run: |
          rm -rf .image-transfer
          rm -f .github/workflows/apply-updated-logo.yml

      - name: Commit updated images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update consulting graphic contact information"
          git push
